name: Prototype build checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Cryptography regression tests
        run: npm test
      - name: Validate transactional D1 draft schema with SQLite
        run: python3 scripts/test_d1_schema.py
      - name: Validate concurrent append and nonce rollback
        run: python3 scripts/test_d1_concurrency.py
      - name: Validate v2 D1 integrity constraints with SQLite
        run: python3 scripts/test_d1_v2_integrity.py
      - name: Validate Cloudflare D1 schema with Wrangler local mode
        run: |
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --file docs/D1_TRANSACTIONAL_PROTOTYPE.sql
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='sandbox_entries'" | grep -q sandbox_entries
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --file docs/D1_V2_INTEGRITY_EXTENSION.sql
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='sandbox_integrity_entries_v2'" | grep -q sandbox_integrity_entries_v2
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --file scripts/d1_local_smoke_fixture.sql
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "SELECT entry_id FROM sandbox_entries WHERE vault_id='fictionalVaultId123456' AND revision=1" | grep -q fictionalEntryId123456
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "SELECT vault_id FROM sandbox_vaults WHERE vault_id='fictionalVaultId123456' AND latest_revision=1" | grep -q fictionalVaultId123456
          if npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "INSERT INTO sandbox_consumed_nonces(nonce,consumed_ms) VALUES ('BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB',3000)"; then
            echo "Replay protection failed: duplicate nonce accepted"
            exit 1
          fi
      - name: Typecheck and build
        run: npm run build
