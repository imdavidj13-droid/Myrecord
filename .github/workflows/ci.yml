name: Prototype build checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Cryptography regression tests
        run: npm test
      - name: Validate transactional D1 draft schema with SQLite
        run: python3 scripts/test_d1_schema.py
      - name: Typecheck and build
        run: npm run build
