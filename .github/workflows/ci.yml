name: Prototype build checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Cryptography regression tests
        run: npm test
      - name: Validate transactional D1 draft schema with SQLite
        run: python3 scripts/test_d1_schema.py
      - name: Validate concurrent append and nonce rollback
        run: python3 scripts/test_d1_concurrency.py
      - name: Validate v2 D1 integrity constraints with SQLite
        run: python3 scripts/test_d1_v2_integrity.py
      - name: Validate atomic D1 vault registration with SQLite
        run: python3 scripts/test_d1_registration.py
      - name: Validate Cloudflare D1 schema with Wrangler local mode
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --file docs/D1_TRANSACTIONAL_PROTOTYPE.sql
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='sandbox_entries'" | grep -q sandbox_entries
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --file docs/D1_V2_INTEGRITY_EXTENSION.sql
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='sandbox_integrity_entries_v2'" | grep -q sandbox_integrity_entries_v2
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --file scripts/d1_local_smoke_fixture.sql
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --file docs/D1_REGISTRATION_PROTOTYPE.sql
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='sandbox_registration_challenges'" | grep -q sandbox_registration_challenges
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "SELECT entry_id FROM sandbox_entries WHERE vault_id='fictionalVaultId123456' AND revision=1" | grep -q fictionalEntryId123456
          npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "SELECT vault_id FROM sandbox_vaults WHERE vault_id='fictionalVaultId123456' AND latest_revision=1" | grep -q fictionalVaultId123456
          if npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc --command "INSERT INTO sandbox_consumed_nonces(nonce,consumed_ms) VALUES ('BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB',3000)"; then
            echo "Replay protection failed: duplicate nonce accepted"
            exit 1
          fi
      - name: Exercise synthetic registration and encrypted-history SQL lifecycle in local D1
        shell: bash
        run: |
          set -euo pipefail
          D1="npx --yes wrangler@4.156.2 d1 execute mysafespace-d1-local-test --local --config wrangler.d1-test.jsonc"
          $D1 --file scripts/d1_local_lifecycle_fixture.sql
          $D1 --command "SELECT vault_id FROM sandbox_vaults WHERE vault_id='syntheticVault12345678' AND status='active'" | grep -q syntheticVault12345678
          $D1 --command "SELECT vault_id FROM sandbox_integrity_heads_v2 WHERE vault_id='syntheticVault12345678' AND latest_revision=2 AND head_digest='bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'" | grep -q syntheticVault12345678
          $D1 --command "SELECT entry_id FROM sandbox_integrity_entries_v2 WHERE vault_id='syntheticVault12345678' AND revision=2 AND previous_digest='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'" | grep -q syntheticLifecycleEntry002
          $D1 --command "SELECT nonce FROM sandbox_registration_challenges WHERE vault_id='syntheticVault12345678' AND consumed_ms=2000 AND consume_marker='MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM'" | grep -q RRRRRRR
          if $D1 --command "INSERT INTO sandbox_vaults(vault_id,lookup_id,verification_jwk,wrapped_backup_json) VALUES('orphanLifecycleVault01','OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO','{}','{}')"; then
            echo "FAIL: Unauthenticated registration was accepted"
            exit 1
          fi
          if $D1 --command "UPDATE sandbox_registration_challenges SET consumed_ms=3000,consume_marker='ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ' WHERE nonce='RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR'"; then
            echo "FAIL: Registration challenge replay was accepted"
            exit 1
          fi
          if $D1 --command "INSERT INTO sandbox_integrity_entries_v2(entry_id,vault_id,revision,previous_digest,envelope_digest,encrypted_envelope_json,server_received_ms) VALUES('syntheticLifecycleEntry003','syntheticVault12345678',3,'cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc','dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd','{}',2003)"; then
            echo "FAIL: Broken digest continuity was accepted"
            exit 1
          fi
          if $D1 --command "UPDATE sandbox_integrity_entries_v2 SET envelope_digest='ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff' WHERE entry_id='syntheticLifecycleEntry001'"; then
            echo "FAIL: Append-only ciphertext was mutated"
            exit 1
          fi

      - name: Verify real AES-GCM ciphertext in isolated Wrangler D1
        run: node scripts/test_d1_local_crypto.mjs
      - name: Verify isolated local Worker and D1 binding
        run: node scripts/test_worker_local_d1.mjs
      - name: Verify signed browser-to-local-Worker-to-D1 lifecycle
        run: node scripts/test_worker_signed_protocol.mjs
      - name: Typecheck and build
        run: npm run build
